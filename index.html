<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLIO PREMIX</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KLIO PREMIX">
    
    <link rel="apple-touch-icon" href="images.png">
    <link rel="icon" type="image/png" href="images.png">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b100d;
            --card-bg: rgba(22, 30, 25, 0.72);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #00cbc6;
            --accent-glow: rgba(0, 203, 198, 0.25);
            --accent-glow-strong: rgba(0, 203, 198, 0.45);
            --accent-bg-subtle: rgba(0, 203, 198, 0.08);
            --text-color: #ffffff;
            --text-muted: #8fa196;
            --success-color: #2ed573;
            --warning-color: #ff4757;
        }

        html, body {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: calc(36px + env(safe-area-inset-top)) 20px 45px 20px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        body.loaded {
            opacity: 1;
        }

        body.modal-open {
            overflow: hidden !important;
            touch-action: none;
        }

        /* Dynamic Ambient Glow */
        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 140vw;
            height: 65vh;
            background: radial-gradient(ellipse at 50% 0%, var(--accent-glow) 0%, transparent 68%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.6s ease;
        }

        header, .section-title, .cocktail-selector, .slider-container, 
        .ingredients-card, .log-action-btn, .global-warning-container {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 18px;
        }

        header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px var(--accent-glow-strong), 0 2px 5px rgba(0, 0, 0, 0.8);
            transition: color 0.4s ease, text-shadow 0.4s ease;
            cursor: pointer;
        }

        /* Minimal Status Pill */
        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.4px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--success-color);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .dot.offline {
            background-color: var(--warning-color);
            box-shadow: 0 0 8px var(--warning-color);
        }

        /* Top Warning Banner */
        .global-warning-container {
            display: none;
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px 16px;
            color: #ff6b81;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            animation: pulseWarning 2.2s infinite ease-in-out;
            text-align: center;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.15);
        }

        /* Section Title Fix */
        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            white-space: nowrap;
            gap: 6px;
        }

        /* Glassmorphic Cocktail Selector */
        .cocktail-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .cocktail-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 10px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            word-wrap: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
        }

        .cocktail-btn.active {
            border-color: var(--accent-color);
            background: linear-gradient(145deg, var(--accent-bg-subtle) 0%, rgba(20, 28, 23, 0.85) 100%);
            color: var(--accent-color);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 22px var(--accent-glow), inset 0 0 12px var(--accent-bg-subtle);
        }

        /* Glassmorphic Slider Container */
        .slider-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 20px var(--accent-bg-subtle);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .volume-display {
            font-family: 'Fredoka', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 16px var(--accent-glow-strong);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .slider-track {
            position: absolute;
            left: 0;
            right: 0;
            height: 10px;
            border-radius: 6px;
            background: #202b25;
            pointer-events: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: calc(100% + 32px) !important;
            margin: 0 -16px !important;
            background: transparent !important;
            height: 44px;
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        /* Minimal Glowing Glass Knob */
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow-strong), 0 4px 10px rgba(0,0,0,0.5);
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.4s ease;
        }

        .slider-input::-webkit-slider-thumb:active {
            transform: scale(1.18);
            box-shadow: 0 0 25px var(--accent-color);
        }

        .slider-input::-moz-range-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow-strong), 0 4px 10px rgba(0,0,0,0.5);
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.4s ease;
        }

        .slider-input::-moz-range-thumb:active {
            transform: scale(1.18);
            box-shadow: 0 0 25px var(--accent-color);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            padding: 0 4px;
            font-weight: 600;
        }

        /* Premix History Container */
        .last-prep-box {
            background: rgba(0, 0, 0, 0.35);
            border-left: 3.5px solid var(--accent-color);
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            touch-action: pan-y;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .last-prep-box.expired {
            border-left-color: var(--warning-color);
            background: rgba(255, 71, 87, 0.09);
        }

        .last-prep-box:active {
            background: rgba(0, 0, 0, 0.5);
        }

        .last-prep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .last-prep-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        .last-prep-hint {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .history-warning-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 71, 87, 0.18);
            border: 1px solid rgba(255, 71, 87, 0.45);
            color: #ff6b81;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            animation: pulseWarning 2.2s infinite ease-in-out;
        }

        @keyframes pulseWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .history-vol {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .history-item:not(:first-child) .history-date {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 12px;
        }

        .history-item:not(:first-child) .history-vol {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Glassmorphic Ingredients Card */
        .ingredients-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 20px var(--accent-bg-subtle);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .ingredient-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 13px 0;
        }

        .ingredient-item:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .ing-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ing-amount {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent-color);
            transition: color 0.4s ease;
        }

        /* Visual Ratio Bar */
        .ratio-bar-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            margin-top: 7px;
            overflow: hidden;
        }

        .ratio-bar-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            transition: width 0.3s ease, background-color 0.4s ease;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .ratio-subtext {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            justify-content: flex-end;
            font-weight: 500;
            opacity: 0.8;
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 6px;
            padding: 2px 6px;
            line-height: 1.2;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .info-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .ingredient-info-box {
            display: none;
            background: rgba(0, 0, 0, 0.35);
            border-left: 3px solid var(--accent-color);
            padding: 10px 14px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 12.5px;
            color: #dcdde1;
            line-height: 1.6;
        }

        .ingredient-info-box.active {
            display: block;
        }

        /* Neon Bar Ticket Service Box */
        .service-info {
            margin-top: 18px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(46, 213, 115, 0.08) 0%, rgba(0, 0, 0, 0.3) 100%);
            border: 1px dashed rgba(46, 213, 115, 0.4);
            border-radius: 14px;
            font-size: 14px;
            color: #2ed573;
            font-weight: 600;
            line-height: 1.5;
            box-shadow: inset 0 0 15px rgba(46, 213, 115, 0.04);
        }
        
        .service-info span {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        /* Glowing Log Button */
        .log-action-btn {
            width: 100%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0.3) 100%);
            color: var(--accent-color);
            border: 1.5px solid var(--accent-color);
            border-radius: 18px;
            padding: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 16px var(--accent-glow);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .log-action-btn:active {
            transform: scale(0.97);
            background-color: var(--accent-bg-subtle);
        }

        .log-action-btn.success {
            background: var(--success-color);
            border-color: var(--success-color);
            color: #0b100d;
            box-shadow: 0 0 25px rgba(46, 213, 115, 0.6);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.60);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: rgba(18, 25, 21, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            flex: 1;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        .modal-body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        /* Custom Confirmation Modal Styles */
        .confirm-modal-overlay {
            z-index: 2000;
        }

        .confirm-modal-box {
            max-width: 360px;
            padding: 24px 20px 20px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(16, 23, 19, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .confirm-modal-icon {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .confirm-modal-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            margin: 0;
        }

        .confirm-modal-body {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.55;
            width: 100%;
        }

        .confirm-modal-highlight {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 10px;
            color: var(--text-color);
            font-weight: 500;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
        }

        .confirm-modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
        }

        .confirm-btn {
            border-radius: 14px;
            padding: 13px 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .confirm-btn.cancel {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .confirm-btn.cancel:active {
            background: rgba(255, 255, 255, 0.16);
            color: var(--text-color);
        }

        .confirm-btn.confirm {
            background: var(--accent-color);
            color: #0b100d;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .confirm-btn.confirm.danger {
            background: var(--warning-color);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 71, 87, 0.4);
        }

        .confirm-btn:active {
            transform: scale(0.97);
        }

        .month-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .month-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .month-btn:active {
            background: var(--accent-bg-subtle);
            border-color: var(--accent-color);

        function hexToRgba(hex, alpha) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

            updateConnectionStatus(false);

        /* -------------------------------------------------------------
           Offline Queue & Sync Logic
        ------------------------------------------------------------- */
        function getOfflineQueue() {
            try {
                return JSON.parse(localStorage.getItem('klio_offline_queue') || '[]');
            } catch(e) {
                return [];
            }
        }

        function saveOfflineQueue(queue) {
            localStorage.setItem('klio_offline_queue', JSON.stringify(queue));
        }

        let isSyncing = false;
        async function syncOfflineQueue() {
            if (!navigator.onLine || !db || isSyncing) return;
            
            const queue = getOfflineQueue();
            if (queue.length === 0) return;

            isSyncing = true;
            const remaining = [];
            
            for (const item of queue) {
                try {
                    await db.ref('all_logs/' + item.id).set(item);

                    const snap = await db.ref('last_premixes/' + item.cocktail).once('value');
                    let currentHistory = getHistoryArray(snap.val());
                    
                    if (!currentHistory.some(h => h.id === item.id)) {
                        currentHistory.unshift(item);
                        currentHistory.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        await db.ref('last_premixes/' + item.cocktail).set(currentHistory.slice(0, 3));
                    }
                } catch (err) {
                    console.error("Σφάλμα συγχρονισμού offline log:", item, err);
                    remaining.push(item);
                }
            }

            saveOfflineQueue(remaining);
            isSyncing = false;
        }

            updateConnectionStatus(true);
            syncOfflineQueue();

        let currentCocktail = 'happy_hawaiian';

        /* -------------------------------------------------------------
           Custom Confirm Modal Helper
        ------------------------------------------------------------- */
        let confirmResolve = null;

        function showCustomConfirm({ title, icon, htmlMessage, confirmText = "Συνέχεια", cancelText = "Ακύρωση", isDanger = false }) {
            return new Promise((resolve) => {
                confirmResolve = resolve;
                const modal = document.getElementById('confirmModal');
                document.getElementById('confirmModalIcon').innerText = icon || '⚠️';
                document.getElementById('confirmModalTitle').innerText = title || 'Επιβεβαίωση';
                document.getElementById('confirmModalBody').innerHTML = htmlMessage || '';
                
                const okBtn = document.getElementById('confirmOkBtn');
                okBtn.innerText = confirmText;
                if (isDanger) {
                    okBtn.classList.add('danger');
                } else {
                    okBtn.classList.remove('danger');
                }

                document.getElementById('confirmCancelBtn').innerText = cancelText;

                document.body.classList.add('modal-open');
                modal.classList.add('active');

                if (navigator.vibrate) navigator.vibrate(25);
            });
        }

        function handleConfirmModalClose(result) {
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('active');
            
            const statsModal = document.getElementById('statsModal');

                document.body.classList.remove('modal-open');

            if (confirmResolve) {
                confirmResolve(result);
                confirmResolve = null;
            }

        function selectCocktail(cocktailKey, element) {
            document.querySelectorAll('.cocktail-btn').forEach(btn => btn.classList.remove('active'));

            updateLastPrepUI();

        function toggleIngInfo(id, event) {
            event.stopPropagation();
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active');
        }

        function updateValues() {
            const slider = document.getElementById('premixSlider');
            const sliderValue = parseInt(slider.value);
            const totalVolume = sliderValue * 100;
            
            if (sliderValue !== lastSliderValue) {
                if (navigator.vibrate) navigator.vibrate(12);
                lastSliderValue = sliderValue;
            }
            
            const recipe = recipes[currentCocktail];
            
            // Ενημέρωση Dynamic Glow μεταβλητών
            document.documentElement.style.setProperty('--accent-color', recipe.color);
            document.documentElement.style.setProperty('--accent-glow', hexToRgba(recipe.color, 0.22));
            document.documentElement.style.setProperty('--accent-glow-strong', hexToRgba(recipe.color, 0.45));
            document.documentElement.style.setProperty('--accent-bg-subtle', hexToRgba(recipe.color, 0.08));
            
            const percentage = ((sliderValue - slider.min) / (slider.max - slider.min)) * 100;
            const track = document.getElementById('sliderTrack');
            if (track) {
                track.style.background = `linear-gradient(to right, var(--accent-color) 0%, var(--accent-color) ${percentage}%, #202b25 ${percentage}%, #202b25 100%)`;
            }

            const formattedVolume = totalVolume === 1000 ? "1 lt" : totalVolume + " ml";
            document.getElementById('volumeDisplay').innerText = formattedVolume;

            const totalBaseMl = recipe.ingredients.reduce((sum, ing) => {
                return sum + (ing.unit === 'ml' ? ing.baseAmount : 0);
            }, 0);

            const listContainer = document.getElementById('ingredientsList');
            listContainer.innerHTML = '';

            recipe.ingredients.forEach((ing, index) => {
                let calculatedAmount = (ing.baseAmount / 10) * sliderValue;
                calculatedAmount = Math.round(calculatedAmount * 10) / 10;

                const itemDiv = document.createElement('div');

                    infoBox = `<div id="ing-info-${index}" class="ingredient-info-box">${infoContent}</div>`;
                }

                // Ratio percentage
                let ratioPct = 0;
                let ratioBarHtml = '';
                if (ing.unit === 'ml' && totalBaseMl > 0) {
                    ratioPct = Math.round((ing.baseAmount / totalBaseMl) * 100);
                    ratioBarHtml = `
                        <div class="ratio-bar-track">

                        <div class="ratio-subtext">${ratioPct}% of mix</div>

                    ${infoBox}
                `;

            });

            document.getElementById('serviceText').innerText = recipe.service;

        function getHistoryArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return [...data];
            if (typeof data === 'object') {
                if (data.date) return [data];
                return Object.values(data);
            }
            return [];
        }

        // Global Warning Check
        function updateGlobalWarning() {
            const container = document.getElementById('globalWarningContainer');
            if (!container) return;

            const now = Date.now();
            const expiredList = [];

            Object.keys(recipes).forEach(key => {
                const history = getHistoryArray(cloudData[key]);
                if (history.length > 0 && history[0].timestamp) {
                    const limitDays = key === 'negroni' ? 15 : 4;
                    const limitMs = limitDays * 24 * 60 * 60 * 1000;
                    if (now - history[0].timestamp >= limitMs) {
                        expiredList.push(recipes[key].name);
                    }
                }
            });

            if (expiredList.length > 0) {
                container.style.display = 'block';
                container.innerHTML = `⚠️ <strong>Προσοχή premix:</strong> ${expiredList.join(', ')}`;
            } else {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        function updateLastPrepUI() {
            const history = getHistoryArray(cloudData[currentCocktail]);
            const listEl = document.getElementById('historyList');
            const boxEl = document.getElementById('lastPrepBox');
            if (!listEl) return;

            if (history.length === 0) {
                if (boxEl) boxEl.classList.remove('expired');
                listEl.innerHTML = `
                    <div class="history-item">
                        <span class="history-date" style="color:var(--text-muted); font-weight:400;">Δεν υπάρχει ιστορικό ακόμα</span>
                        <span class="history-vol">-</span>
                    </div>`;
                return;
            }

            const latest = history[0];
            const limitDays = currentCocktail === 'negroni' ? 15 : 4;
            const thresholdMs = limitDays * 24 * 60 * 60 * 1000;
            const now = Date.now();
            
            let isExpired = false;
            let daysPassed = 0;

            if (latest.timestamp) {
                const diff = now - latest.timestamp;
                if (diff >= thresholdMs) {
                    isExpired = true;
                    daysPassed = Math.floor(diff / (24 * 60 * 60 * 1000));
                }
            }

            if (boxEl) {
                if (isExpired) {
                    boxEl.classList.add('expired');
                } else {
                    boxEl.classList.remove('expired');
                }
            }

            let warningBanner = '';
            if (isExpired) {
                warningBanner = `
                    <div class="history-warning-banner">
                        <span>⚠️</span>
                        <span>Προσοχή: Πέρασαν ${daysPassed} μέρες από το τελευταίο premix!</span>
                    </div>
                `;
            }

            listEl.innerHTML = warningBanner + history.slice(0, 3).map((item) => `
                <div class="history-item">
                    <span class="history-date">${item.date || '-'}</span>
                    <span class="history-vol">${item.volume || '-'}</span>
                </div>
            `).join('');
        }

        async function recordNewBatch() {
            const slider = document.getElementById('premixSlider');
            const sliderValue = parseInt(slider.value);
            if (sliderValue === 0) return;

            const history = getHistoryArray(cloudData[currentCocktail]);
            if (history.length > 0 && history[0].timestamp) {
                const nowMs = Date.now();
                const diffMs = nowMs - history[0].timestamp;
                const tenMinutesMs = 10 * 60 * 1000;

                if (diffMs >= 0 && diffMs < tenMinutesMs) {
                    const diffMinutes = Math.floor(diffMs / (60 * 1000));
                    const cocktailName = recipes[currentCocktail].name;
                    const timeText = diffMinutes === 0 
                        ? "μόλις τώρα" 
                        : (diffMinutes === 1 ? "πριν από 1 λεπτό" : `πριν από ${diffMinutes} λεπτά`);

                    const confirmed = await showCustomConfirm({
                        title: "Πρόσφατη Καταχώριση",
                        icon: "⚠️",
                        htmlMessage: `
                            Υπάρχει ήδη καταχώριση για <strong>${cocktailName}</strong> ${timeText}.
                            <div class="confirm-modal-highlight">Συνέχεια με δημιουργία νέου premix;</div>
                        `,
                        confirmText: "Καταχώριση",
                        cancelText: "Ακύρωση",
                        isDanger: false
                    });

                    if (!confirmed) return;
                }
            }

            const totalVolume = sliderValue * 100;
            const formattedVolume = totalVolume === 1000 ? "1 lt" : totalVolume + " ml";
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit' });
            const timeStr = now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            const fullDateString = `${dateStr} @ ${timeStr}`;

            let logId = (db ? db.ref('all_logs').push().key : null) || ('local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5));

            const batchData = {
                id: logId,
                cocktail: currentCocktail,
                cocktailName: recipes[currentCocktail].name,
                volume_ml: totalVolume,
                volume: formattedVolume,
                date: fullDateString,
                timestamp: now.getTime()
            };

            allLogsData[logId] = batchData;

            let updatedHistory = getHistoryArray(cloudData[currentCocktail]);
            updatedHistory.unshift(batchData);
            if (updatedHistory.length > 3) {
                updatedHistory = updatedHistory.slice(0, 3);
            }
            cloudData[currentCocktail] = updatedHistory;

            updateLastPrepUI();
            updateGlobalWarning();

            const queue = getOfflineQueue();
            queue.push(batchData);
            saveOfflineQueue(queue);

            if (navigator.onLine && db) {
                syncOfflineQueue();
            }

            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            const btn = document.getElementById('logBtn');
            const textSpan = document.getElementById('logBtnText');
            const iconSpan = document.getElementById('logBtnIcon');

            btn.classList.add('success');
            textSpan.innerText = navigator.onLine ? "Saved ✓" : "Saved (Offline) ✓";
            iconSpan.innerText = "";

            setTimeout(() => {
                btn.classList.remove('success');
                textSpan.innerText = "Log Premix";
                iconSpan.innerText = "📝";
            }, 1000);
        }

        async function deleteLatestLog() {
            let history = getHistoryArray(cloudData[currentCocktail]);
            if (history.length === 0) return;

            const latest = history[0];
            const cocktailName = recipes[currentCocktail].name;

            const confirmed = await showCustomConfirm({
                title: "Διαγραφή Premix",
                icon: "🗑️",
                htmlMessage: `
                    Θέλεις σίγουρα να διαγράψεις την τελευταία εγγραφή;
                    <div class="confirm-modal-highlight">
                        🍹 <strong>${cocktailName}</strong><br>
                        📦 <strong>${latest.volume || '-'}</strong> (${latest.date || '-'})
                    </div>
                `,
                confirmText: "Διαγραφή",
                cancelText: "Ακύρωση",
                isDanger: true
            });

            if (!confirmed) return;

            if (latest.id) {
                const queue = getOfflineQueue();
                const filteredQueue = queue.filter(q => q.id !== latest.id);
                saveOfflineQueue(filteredQueue);
            }

            if (latest.id) {
                if (db && navigator.onLine) {
                    db.ref('all_logs/' + latest.id).remove();
                }
                delete allLogsData[latest.id];
            } else if (latest.timestamp && db && navigator.onLine) {
                db.ref('all_logs').orderByChild('timestamp').equalTo(latest.timestamp).once('value', (snapshot) => {
                    snapshot.forEach((child) => {
                        if (child.val().cocktail === currentCocktail) {
                            child.ref.remove();
                        }
                    });
                });
            }

            history.shift();

            if (db && navigator.onLine) {
                db.ref('last_premixes/' + currentCocktail).set(history);
            }
            cloudData[currentCocktail] = history;
            updateLastPrepUI();
            updateGlobalWarning();

            if (navigator.vibrate) navigator.vibrate(80);
        }

        let pressTimer = null;
        const prepBox = document.getElementById('lastPrepBox');

        function startPress() {
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(40);
                deleteLatestLog();
            }, 650);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        prepBox.addEventListener('touchstart', startPress, { passive: true });
        prepBox.addEventListener('touchend', cancelPress);
        prepBox.addEventListener('touchcancel', cancelPress);
        prepBox.addEventListener('touchmove', cancelPress);

        prepBox.addEventListener('mousedown', startPress);
        prepBox.addEventListener('mouseup', cancelPress);
        prepBox.addEventListener('mouseleave', cancelPress);
        prepBox.addEventListener('contextmenu', (e) => e.preventDefault());

        /* -------------------------------------------------------------
           Triple-Tap Header & Monthly Stats Logic
        ------------------------------------------------------------- */
        const greekMonths = [
            'Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 
            'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 
            'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'
        ];

        let tapCount = 0;
        let tapTimer = null;
        const titleEl = document.getElementById('appTitle');

        titleEl.addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount === 3) {
                tapCount = 0;
                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                openMonthlyStats();
            } else {
                tapTimer = setTimeout(() => {
                    tapCount = 0;
                }, 450);
            }
        });

        function openMonthlyStats() {
            const modal = document.getElementById('statsModal');
            modal.classList.add('active');
            document.body.classList.add('modal-open');
            renderMonthSelectionView();
        }

        function closeMonthlyStats(e) {
            if (e && e.target !== e.currentTarget && !e.target.classList.contains('modal-close-btn')) {
                return;
            }
            const modal = document.getElementById('statsModal');
            modal.classList.remove('active');
            document.body.classList.remove('modal-open');
        }

        function toggleStatsViewMode() {
            statsViewMode = (statsViewMode === 'volume') ? 'cocktails' : 'volume';
            if (navigator.vibrate) navigator.vibrate(30);
            if (currentViewingMonthKey) {
                renderMonthDetailView(currentViewingMonthKey, currentViewingMonthLabel);
            }
        }

        function renderMonthSelectionView() {
            const body = document.getElementById('modalBody');
            const logsArray = Object.values(allLogsData || {});

            if (logsArray.length === 0) {
                body.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 30px 10px;">
                        <span style="font-size: 32px; display:block; margin-bottom:10px;">📭</span>
                        Δεν υπάρχουν ακόμη καταγεγραμμένα δεδομένα.
                    </div>`;
                return;
            }

            const monthsMap = {};
            logsArray.forEach(log => {
                if (!log.timestamp) return;
                const d = new Date(log.timestamp);
                const year = d.getFullYear();
                const month = d.getMonth();
                const key = `${year}-${String(month + 1).padStart(2, '0')}`;
                
                if (!monthsMap[key]) {
                    monthsMap[key] = {
                        key: key,
                        year: year,
                        month: month,
                        label: `${greekMonths[month]} ${year}`,
                        totalMl: 0
                    };
                }
                const vol = log.volume_ml || (log.volume && log.volume.includes('lt') ? 1000 : parseInt(log.volume) || 0);
                monthsMap[key].totalMl += vol;
            });

            const sortedKeys = Object.keys(monthsMap).sort().reverse();

            body.innerHTML = `
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">
                    Επίλεξε μήνα για αναλυτικά στοιχεία παραγωγής:
                </div>
                <div class="month-list">
                    ${sortedKeys.map(k => {
                        const m = monthsMap[k];
                        const totalLt = (m.totalMl / 1000).toFixed(1);
                        return `
                            <button class="month-btn" onclick="renderMonthDetailView('${m.key}', '${m.label}')">
                                <span>📅 ${m.label}</span>
                                <span class="badge">${totalLt} lt</span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderMonthDetailView(monthKey, monthLabel) {
            currentViewingMonthKey = monthKey;
            currentViewingMonthLabel = monthLabel;

            const body = document.getElementById('modalBody');
            const logsArray = Object.values(allLogsData || {});

            const cocktailStats = {};
            Object.keys(recipes).forEach(key => {
                cocktailStats[key] = {
                    key: key,
                    name: recipes[key].name,
                    color: recipes[key].color,
                    serviceDose: recipes[key].serviceDose || 100,
                    totalMl: 0
                };
            });

            let grandTotalMl = 0;

            logsArray.forEach(log => {
                if (!log.timestamp) return;
                const d = new Date(log.timestamp);
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                
                if (key === monthKey) {
                    const cKey = log.cocktail;
                    const vol = log.volume_ml || (log.volume && log.volume.includes('lt') ? 1000 : parseInt(log.volume) || 0);
                    
                    if (cocktailStats[cKey]) {
                        cocktailStats[cKey].totalMl += vol;
                    }
                    grandTotalMl += vol;
                }
            });

            let grandTotalCocktails = 0;
            Object.values(cocktailStats).forEach(stat => {
                stat.cocktails = Math.floor(stat.totalMl / stat.serviceDose);
                grandTotalCocktails += stat.cocktails;
            });

            const isCocktailsMode = (statsViewMode === 'cocktails');

            const sortedList = Object.values(cocktailStats).sort((a, b) => {
                if (isCocktailsMode) {
                    return (b.cocktails - a.cocktails) || (b.totalMl - a.totalMl);
                }
                return b.totalMl - a.totalMl;
            });

            const summaryLabel = isCocktailsMode ? 'Συνολικα Cocktails' : 'Συνολικη Παραγωγη';
            const toggleHint = isCocktailsMode ? '⇄ Litres' : '⇄ Cocktails';
            const formattedGrandTotal = isCocktailsMode
                ? `${grandTotalCocktails} 🍸`
                : (grandTotalMl >= 1000 ? (grandTotalMl / 1000).toFixed(1) + ' lt' : grandTotalMl + ' ml');

            body.innerHTML = `
                <div class="month-detail-header">
                    <button class="back-btn" onclick="renderMonthSelectionView()">← Πίσω</button>
                    <strong style="font-size: 15px;">${monthLabel}</strong>
                </div>

                <div class="stat-summary-card" onclick="toggleStatsViewMode()" title="Πάτα για αλλαγή μονάδας">
                    <div>
                        <div class="label">${summaryLabel}</div>
                        <span class="unit-toggle-hint">${toggleHint}</span>
                    </div>
                    <div class="val">${formattedGrandTotal}</div>
                </div>

                <div class="stats-cocktail-list">
                    ${sortedList.map(stat => {
                        const volDisplay = stat.totalMl >= 1000 
                            ? (stat.totalMl / 1000).toFixed(1) + ' lt' 
                            : stat.totalMl + ' ml';
                        
                        const displayVal = isCocktailsMode 
                            ? `${stat.cocktails} 🍸` 
                            : volDisplay;

                        const subText = (isCocktailsMode && stat.totalMl > 0)
                            ? `<div style="font-size: 11px; color: var(--text-muted); margin-top:2px;">${volDisplay} premix</div>`
                            : '';

                        const opacity = (isCocktailsMode ? stat.cocktails === 0 : stat.totalMl === 0) ? 'opacity: 0.35;' : '';

                        return `
                            <div class="stats-cocktail-row" style="${opacity}">
                                <div>
                                    <span class="stats-cocktail-name" style="color: ${stat.color}">${stat.name}</span>
                                    ${subText}
                                </div>
                                <div class="stats-cocktail-volume">${displayVal}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        window.onload = function() {
            updateValues();
            document.body.classList.add('loaded');
            syncOfflineQueue();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    window.location.reload();
                                }
                            });
                        }
                    });
                }).catch((err) => console.error('Service Worker Registration failed:', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="el">
<head>
    <!-- 0ms Blocking Execution: Κλειδώνει το φόντο σε σκούρο πριν ξεκινήσει το rendering -->
    <script>
        document.documentElement.style.backgroundColor = '#0e1310';
        document.documentElement.style.colorScheme = 'dark';
    </script>

    <meta charset="UTF-8">

    <!-- 1. CRITICAL CSS (Εκτελείται ακαριαία στο 1ο frame) -->
    <style>
        html, body {
            background-color: #0e1310 !important;
            background: #0e1310 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #app-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0e1310 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            opacity: 1;
            visibility: visible;
            will-change: opacity, visibility;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);

            /* ΑΠΟΜΟΝΩΣΗ ΑΠΟ REPAINTS & FONTS */
            contain: strict;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        #app-splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-icon {
            font-size: 50px;
            animation: splashPulse 1.2s infinite ease-in-out;
            will-change: transform, opacity;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        @keyframes splashPulse {
            0%, 100% { 
                transform: scale(1) translateZ(0); 
                opacity: 0.8; 
            }
            50% { 
                transform: scale(1.15) translateZ(0); 
                opacity: 1; 
            }
        }
    </style>

    <!-- 2. PWA & THEME CONFIGURATION -->
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <meta name="theme-color" content="#0e1310">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>KLIO PREMIX</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KLIO PREMIX">

    <link rel="apple-touch-icon" href="images.png">
    <link rel="icon" type="image/png" href="images.png">
    <link rel="manifest" href="manifest.json">

    <!-- 3. NON-RENDER-BLOCKING GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@400;600;700&display=swap">
    </noscript>

    <!-- 4. MAIN APP STYLES (Προσθέστε τα υπόλοιπα styles της εφαρμογής σας εδώ) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SPLASH SCREEN CONTAINER -->
    <div id="app-splash">
        <div class="splash-icon">🗿</div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app">
        <!-- Το περιεχόμενο της εφαρμογής σας -->
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

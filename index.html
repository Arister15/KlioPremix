<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLIO PREMIX</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KLIO PREMIX">
    
    <link rel="apple-touch-icon" href="images.png">
    <link rel="icon" type="image/png" href="images.png">
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0e1310;
            --card-bg: #171e1a;
            --accent-color: #ffd32a;
            --text-color: #ffffff;
            --text-muted: #8fa196;
            --success-color: #2ed573;
            --warning-color: #ff4757;
        }

        html, body {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: calc(40px + env(safe-area-inset-top)) 20px 40px 20px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, background-color 0.4s ease;
        }

        body.loaded {
            opacity: 1;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: color 0.4s ease;
        }

        .live-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px var(--success-color);
        }

        /* Top Warning Banner */
        .global-warning-container {
            display: none;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--warning-color);
            border-radius: 14px;
            padding: 10px 14px;
            color: #ff6b81;
            font-size: 12px;
            font-weight: 600;
            margin-top: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
            animation: pulseWarning 2.2s infinite ease-in-out;
            text-align: center;
        }

        .section-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
            letter-spacing: 0.8px;
        }

        .cocktail-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .cocktail-btn {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 14px 8px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            word-wrap: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
        }

        .cocktail-btn.active {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
        }

        .slider-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .volume-display {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            transition: color 0.4s ease;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 44px;
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .slider-track {
            position: absolute;
            left: 0;
            right: 0;
            height: 10px;
            border-radius: 5px;
            background: #25302a;
            pointer-events: none;
        }

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: calc(100% + 44px) !important;
            margin: 0 -22px !important;
            background: transparent !important;
            height: 44px;
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 44px;
            height: 44px;
            background-color: transparent !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><text y="34" x="22" font-size="34" text-anchor="middle">🧪</text></svg>') !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            outline: none !important;
            transition: transform 0.1s ease;
        }
        
        .slider-input::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        .slider-input::-moz-range-thumb {
            width: 44px;
            height: 44px;
            background-color: transparent !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><text y="34" x="22" font-size="34" text-anchor="middle">🧪</text></svg>') !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            padding: 0 2px;
            font-weight: 500;
        }

        /* Premix History Container */
        .last-prep-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            touch-action: pan-y;
        }

        .last-prep-box.expired {
            border-left-color: var(--warning-color);
            background: rgba(255, 71, 87, 0.08);
        }

        .last-prep-box:active {
            background: rgba(0, 0, 0, 0.45);
        }

        .last-prep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .last-prep-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .last-prep-hint {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Warning Banner Styles */
        .history-warning-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 71, 87, 0.18);
            border: 1px solid rgba(255, 71, 87, 0.45);
            color: #ff6b81;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            animation: pulseWarning 2.2s infinite ease-in-out;
        }

        @keyframes pulseWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .history-vol {
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .history-item:not(:first-child) .history-date {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 12px;
        }

        .history-item:not(:first-child) .history-vol {
            font-size: 13px;
            opacity: 0.8;
        }

        .ingredients-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .ingredient-item {
            border-bottom: 1px solid #25302a;
            padding: 14px 0;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .ing-name {
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .ing-amount {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--accent-color);
            transition: color 0.4s ease;
        }

        .info-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-left: 6px;
            padding: 2px 4px;
            line-height: 1;
            opacity: 0.85;
        }

        .ingredient-info-box {
            display: none;
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--accent-color);
            padding: 10px 14px;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #dcdde1;
            line-height: 1.6;
        }

        .ingredient-info-box.active {
            display: block;
        }

        .service-info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #25302a;
            font-size: 14px;
            color: #4cd137;
            font-weight: 600;
            line-height: 1.5;
        }
        
        .service-info span {
            color: var(--text-muted);
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .log-action-btn {
            width: 100%;
            background-color: var(--card-bg);
            color: var(--accent-color);
            border: 1.5px solid var(--accent-color);
            border-radius: 16px;
            padding: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .log-action-btn:active {
            transform: scale(0.98);
            background-color: rgba(255, 211, 42, 0.1);
        }

        .log-action-btn.success {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: #0e1310;
        }
    </style>
</head>
<body>

    <header>
        <h1>🗿 Klio Premix 🌴</h1>
        <div class="live-status">
            <span class="dot"></span>
            <span id="syncText">Live</span>
        </div>
    </header>

    <!-- Top Warning Banner Container -->
    <div id="globalWarningContainer" class="global-warning-container"></div>

    <div class="section-title">🍹 COCKTAIL</div>
    <div class="cocktail-selector">
        <button class="cocktail-btn active" onclick="selectCocktail('happy_hawaiian', this)">🌴 Happy Hawaiian</button>
        <button class="cocktail-btn" onclick="selectCocktail('three_birds', this)">🦜 Three Little Birds</button>
        <button class="cocktail-btn" onclick="selectCocktail('tiki_tijuana', this)">🌵 Tiki in Tijuana</button>
        <button class="cocktail-btn" onclick="selectCocktail('mama_africa', this)">🌍 Mama Africa</button>
        <button class="cocktail-btn" onclick="selectCocktail('kyoto', this)">🌸 Kyoto</button>
        <button class="cocktail-btn" onclick="selectCocktail('tiki_zombie', this)">🧟 Tiki Zombie</button>
        <button class="cocktail-btn" onclick="selectCocktail('bahama_mama', this)">🥥 Bahama Mama</button>
        <button class="cocktail-btn" onclick="selectCocktail('negroni', this)">🍊 Negroni</button>
    </div>

    <div class="slider-container">
        <div class="slider-header">
            <span class="section-title" style="margin:0;">🧪 PREMIX AMOUNT</span>
            <div class="volume-display" id="volumeDisplay">1 lt</div>
        </div>
        <div class="slider-wrapper">
            <div class="slider-track" id="sliderTrack"></div>
            <input type="range" min="0" max="10" value="10" class="slider-input" id="premixSlider" oninput="updateValues()">
        </div>
        <div class="slider-labels">
            <span>0ml</span>
            <span>500ml</span>
            <span>1 lt</span>
        </div>

        <div class="last-prep-box" id="lastPrepBox">
            <div class="last-prep-header">
                <span class="last-prep-title">🕒 Premix History</span>
                <span class="last-prep-hint">(Hold to delete latest)</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-item">
                    <span class="history-date" style="color:var(--text-muted)">Συγχρονισμός...</span>
                    <span class="history-vol">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="section-title">📋 RECIPE</div>
    <div class="ingredients-card">
        <div id="ingredientsList"></div>
        <div class="service-info" id="serviceContainer">
            <span>💡 Service:</span>
            <div id="serviceText"></div>
        </div>
    </div>

    <button class="log-action-btn" id="logBtn" onclick="recordNewBatch()">
        <span id="logBtnIcon">📝</span>
        <span id="logBtnText">Log Premix</span>
    </button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC3vc6RNdKYjJBtdOSWTtRBcMSgeMgUqBU",
            authDomain: "premix-ccc71.firebaseapp.com",
            databaseURL: "https://premix-ccc71-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "premix-ccc71",
            storageBucket: "premix-ccc71.firebasestorage.app",
            messagingSenderId: "48406470893",
            appId: "1:48406470893:web:31093471628b14bf0d6ce4",
            measurementId: "G-T9J9EZNGB2"
        };

        let db = null;
        let cloudData = {};

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            
            db.ref('last_premixes').on('value', (snapshot) => {
                cloudData = snapshot.val() || {};
                updateLastPrepUI();
                updateGlobalWarning();
            });
        } catch (e) {
            console.warn("Firebase fallback:", e);
            document.getElementById('syncText').innerText = "Local Mode";
        }

        const recipes = {
            happy_hawaiian: {
                name: "Happy Hawaiian",
                color: "#00cbc6",
                ingredients: [
                    { name: "Blend of rums", baseAmount: 480, unit: "ml" },
                    { name: "Lime juice", baseAmount: 160, unit: "ml" },
                    { name: "Creme de cacao", baseAmount: 120, unit: "ml" },
                    { name: "Mango puree", baseAmount: 80, unit: "ml" },
                    { name: "Passion fruit puree", baseAmount: 80, unit: "ml" },
                    { name: "Falernum", baseAmount: 40, unit: "ml" }
                ],
                service: "120ml Premix + 40ml Pineapple juice"
            },
            three_birds: {
                name: "Three Little Birds",
                color: "#ffbb00",
                ingredients: [
                    { name: "Plantation Original dark", baseAmount: 500, unit: "ml" },
                    { name: "Banana puree", baseAmount: 200, unit: "ml" },
                    { name: "Lime juice", baseAmount: 200, unit: "ml" },
                    { name: "Salted caramel", baseAmount: 100, unit: "ml" },
                    { name: "Angostura bitters", baseAmount: 10, unit: "σταγόνες / dashes" }
                ],
                service: "100ml Premix + 40ml Pineapple juice"
            },
            tiki_tijuana: {
                name: "Tiki in Tijuana",
                color: "#4cd137",
                ingredients: [
                    { name: "Tequila", baseAmount: 550, unit: "ml" },
                    { name: "Mango puree", baseAmount: 220, unit: "ml" },
                    { name: "Yuzu liqueur", baseAmount: 110, unit: "ml" },
                    { name: "Agave syrup", baseAmount: 110, unit: "ml" }
                ],
                service: "90ml Premix + 20ml Lime juice"
            },
            mama_africa: {
                name: "Mama Africa",
                color: "#e15f41",
                ingredients: [
                    { name: "Rum", baseAmount: 400, unit: "ml" },
                    { name: "Lime juice", baseAmount: 160, unit: "ml" },
                    { name: "Mango puree", baseAmount: 160, unit: "ml" },
                    { name: "Biscuit syrup", baseAmount: 160, unit: "ml" },
                    { name: "Otto's vermouth", baseAmount: 120, unit: "ml" }
                ],
                service: "125ml Premix + 30ml Pineapple juice"
            },
            kyoto: {
                name: "Kyoto",
                color: "#a55eea",
                ingredients: [
                    { name: "Gin", baseAmount: 550, unit: "ml" },
                    { 
                        name: "Mint syrup", 
                        baseAmount: 275, 
                        unit: "ml",
                        info: [
                            "2.5 κούπες ζάχαρη",
                            "Καυτό νερό μέχρι 800ml",
                            "1 γαστρονόμος δυόσμο",
                            "30 λεπτά στην άκρη"
                        ]
                    },
                    { name: "Passionfruit puree", baseAmount: 110, unit: "ml" }
                ],
                service: "85ml Premix + 30ml Lime juice"
            },
            tiki_zombie: {
                name: "Tiki Zombie",
                color: "#ff3f34",
                ingredients: [
                    { name: "Blend of rums", baseAmount: 480, unit: "ml" },
                    { name: "Sugar syrup", baseAmount: 80, unit: "ml" },
                    { name: "Triple sec", baseAmount: 80, unit: "ml" },
                    { name: "Amaretto", baseAmount: 120, unit: "ml" },
                    { name: "Lime juice", baseAmount: 160, unit: "ml" }
                ],
                service: "115ml Premix + 50ml Pineapple juice"
            },
            bahama_mama: {
                name: "Bahama Mama",
                color: "#ff7979",
                ingredients: [
                    { name: "Rum", baseAmount: 350, unit: "ml" },
                    { name: "Malibu", baseAmount: 140, unit: "ml" },
                    { name: "Creme de mure", baseAmount: 105, unit: "ml" },
                    { name: "Orange juice", baseAmount: 175, unit: "ml" },
                    { name: "Lime juice", baseAmount: 140, unit: "ml" }
                ],
                service: "130ml Premix + 25ml Pineapple juice"
            },
            negroni: {
                name: "Negroni",
                color: "#c23616",
                ingredients: [
                    { name: "Gin", baseAmount: 300, unit: "ml" },
                    { name: "Campari", baseAmount: 300, unit: "ml" },
                    { name: "Martini Rosso", baseAmount: 300, unit: "ml" },
                    { name: "Water", baseAmount: 100, unit: "ml" }
                ],
                service: "Ready to serve!"
            }
        };

        let currentCocktail = 'happy_hawaiian';
        let lastSliderValue = 10; 

        function selectCocktail(cocktailKey, element) {
            document.querySelectorAll('.cocktail-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            currentCocktail = cocktailKey;
            updateValues();
            updateLastPrepUI();
        }

        function toggleIngInfo(id, event) {
            event.stopPropagation();
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active');
        }

        function updateValues() {
            const slider = document.getElementById('premixSlider');
            const sliderValue = parseInt(slider.value);
            const totalVolume = sliderValue * 100;
            
            if (sliderValue !== lastSliderValue) {
                if (navigator.vibrate) navigator.vibrate(12);
                lastSliderValue = sliderValue;
            }
            
            const recipe = recipes[currentCocktail];
            document.documentElement.style.setProperty('--accent-color', recipe.color);
            
            const percentage = ((sliderValue - slider.min) / (slider.max - slider.min)) * 100;
            const track = document.getElementById('sliderTrack');
            if (track) {
                track.style.background = `linear-gradient(to right, var(--accent-color) 0%, var(--accent-color) ${percentage}%, #25302a ${percentage}%, #25302a 100%)`;
            }

            const formattedVolume = totalVolume === 1000 ? "1 lt" : totalVolume + " ml";
            document.getElementById('volumeDisplay').innerText = formattedVolume;

            const listContainer = document.getElementById('ingredientsList');
            listContainer.innerHTML = '';

            recipe.ingredients.forEach((ing, index) => {
                let calculatedAmount = (ing.baseAmount / 10) * sliderValue;
                calculatedAmount = Math.round(calculatedAmount * 10) / 10;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'ingredient-item';

                let infoBtn = '';
                let infoBox = '';

                if (ing.info) {
                    const infoContent = Array.isArray(ing.info) 
                        ? ing.info.map(line => `• ${line}`).join('<br>') 
                        : ing.info;

                    infoBtn = `<button class="info-btn" onclick="toggleIngInfo('ing-info-${index}', event)">ℹ️</button>`;
                    infoBox = `<div id="ing-info-${index}" class="ingredient-info-box">${infoContent}</div>`;
                }

                itemDiv.innerHTML = `
                    <div class="ingredient-row">
                        <span class="ing-name">${ing.name} ${infoBtn}</span>
                        <span class="ing-amount">${calculatedAmount} ${ing.unit}</span>
                    </div>
                    ${infoBox}
                `;
                listContainer.appendChild(itemDiv);
            });

            document.getElementById('serviceText').innerText = recipe.service;
        }

        function getHistoryArray(data) {
            if (!data) return [];
            if (Array.isArray(data)) return [...data];
            if (typeof data === 'object') {
                if (data.date) return [data];
                return Object.values(data);
            }
            return [];
        }

        // Global Warning (> 4 Days Check)
        function updateGlobalWarning() {
            const container = document.getElementById('globalWarningContainer');
            if (!container) return;

            const FOUR_DAYS_MS = 4 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const expiredList = [];

            Object.keys(recipes).forEach(key => {
                const history = getHistoryArray(cloudData[key]);
                if (history.length > 0 && history[0].timestamp) {
                    if (now - history[0].timestamp >= FOUR_DAYS_MS) {
                        expiredList.push(recipes[key].name);
                    }
                }
            });

            if (expiredList.length > 0) {
                container.style.display = 'block';
                container.innerHTML = `⚠️ <strong>Προσοχή premix:</strong> ${expiredList.join(', ')}`;
            } else {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        function updateLastPrepUI() {
            const history = getHistoryArray(cloudData[currentCocktail]);
            const listEl = document.getElementById('historyList');
            const boxEl = document.getElementById('lastPrepBox');
            if (!listEl) return;

            if (history.length === 0) {
                if (boxEl) boxEl.classList.remove('expired');
                listEl.innerHTML = `
                    <div class="history-item">
                        <span class="history-date" style="color:var(--text-muted); font-weight:400;">Δεν υπάρχει ιστορικό ακόμα</span>
                        <span class="history-vol">-</span>
                    </div>`;
                return;
            }

            const latest = history[0];
            const FOUR_DAYS_MS = 4 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            
            let isExpired = false;
            let daysPassed = 0;

            if (latest.timestamp) {
                const diff = now - latest.timestamp;
                if (diff >= FOUR_DAYS_MS) {
                    isExpired = true;
                    daysPassed = Math.floor(diff / (24 * 60 * 60 * 1000));
                }
            }

            if (boxEl) {
                if (isExpired) {
                    boxEl.classList.add('expired');
                } else {
                    boxEl.classList.remove('expired');
                }
            }

            let warningBanner = '';
            if (isExpired) {
                warningBanner = `
                    <div class="history-warning-banner">
                        <span>⚠️</span>
                        <span>Προσοχή: Πέρασαν ${daysPassed} μέρες από το τελευταίο premix!</span>
                    </div>
                `;
            }

            listEl.innerHTML = warningBanner + history.slice(0, 3).map((item) => `
                <div class="history-item">
                    <span class="history-date">${item.date || '-'}</span>
                    <span class="history-vol">${item.volume || '-'}</span>
                </div>
            `).join('');
        }

        function recordNewBatch() {
            const slider = document.getElementById('premixSlider');
            const sliderValue = parseInt(slider.value);
            if (sliderValue === 0) return;

            const totalVolume = sliderValue * 100;
            const formattedVolume = totalVolume === 1000 ? "1 lt" : totalVolume + " ml";
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit' });
            const timeStr = now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
            const fullDateString = `${dateStr} @ ${timeStr}`;

            const batchData = {
                date: fullDateString,
                volume: formattedVolume,
                timestamp: now.getTime()
            };

            let history = getHistoryArray(cloudData[currentCocktail]);
            history.unshift(batchData);
            if (history.length > 3) {
                history = history.slice(0, 3);
            }

            if (db) {
                db.ref('last_premixes/' + currentCocktail).set(history);
            } else {
                cloudData[currentCocktail] = history;
                updateLastPrepUI();
                updateGlobalWarning();
            }

            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

            const btn = document.getElementById('logBtn');
            const textSpan = document.getElementById('logBtnText');
            const iconSpan = document.getElementById('logBtnIcon');

            btn.classList.add('success');
            textSpan.innerText = "Saved ✓";
            iconSpan.innerText = "";

            setTimeout(() => {
                btn.classList.remove('success');
                textSpan.innerText = "Log Premix";
                iconSpan.innerText = "📝";
            }, 1000);
        }

        function deleteLatestLog() {
            let history = getHistoryArray(cloudData[currentCocktail]);
            if (history.length === 0) return;

            const latest = history[0];
            const confirmDelete = confirm(`Διαγραφή τελευταίας εγγραφής;\n\n🍹 ${recipes[currentCocktail].name}\n📦 ${latest.volume} (${latest.date})`);
            
            if (!confirmDelete) return;

            history.shift();

            if (db) {
                db.ref('last_premixes/' + currentCocktail).set(history);
            } else {
                cloudData[currentCocktail] = history;
                updateLastPrepUI();
                updateGlobalWarning();
            }

            if (navigator.vibrate) navigator.vibrate(80);
        }

        let pressTimer = null;
        const prepBox = document.getElementById('lastPrepBox');

        function startPress() {
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(40);
                deleteLatestLog();
            }, 650);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        prepBox.addEventListener('touchstart', startPress, { passive: true });
        prepBox.addEventListener('touchend', cancelPress);
        prepBox.addEventListener('touchcancel', cancelPress);
        prepBox.addEventListener('touchmove', cancelPress);

        prepBox.addEventListener('mousedown', startPress);
        prepBox.addEventListener('mouseup', cancelPress);
        prepBox.addEventListener('mouseleave', cancelPress);
        prepBox.addEventListener('contextmenu', (e) => e.preventDefault());

        window.onload = function() {
            updateValues();
            document.body.classList.add('loaded');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    window.location.reload();
                                }
                            });
                        }
                    });
                }).catch((err) => console.error('Service Worker Registration failed:', err));
            });
        }
    </script>
</body>
</html>
